name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI PipeLine"]  # 작성한 ci 이름을 대상으로
    types: [completed]          # 해당 ci가 끝날때 실행해라
    branches: [ "main" ]        # main 브랜치에서 돈 CI만 대상으로함

# push 해서 배포가 도는 중에 또 push가 들어와서 동시에 실행되는 일이 없게끔
# concurrency: 배포가 동시에 실행되지 않도록 설정
# group: 이 이름이 같은 배포끼리는 동시에 실행되지 않고 하나씩 실행됨
# cancel-in-progress:
#   true  - 먼저 돌던 배포를 멈추고 새로 들어온 배포 시작
#   false - 먼저 돌던 배포를 끝까지 돌리고 새로 들어온 배포 시작
concurrency:
  group: mople-production-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_APP_REPOSITORY: mople-app-lb
  ECR_NGINX_REPOSITORY: mople-nginx-lb
  ECS_CLUSTER: mople-nginx-cluster
  APP_SERVICE: mople-app-lb-service
  NGINX_SERVICE: mople-nginx-lb-service
  APP_TASK_DEF_FILE: ecs/task-def-app.json
  NGINX_TASK_DEF_FILE: ecs/task-def-nginx.json

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: app 이미지 빌드 및 푸시
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -t $REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG .
          docker tag $REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_APP_REPOSITORY:latest
          docker push $REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_APP_REPOSITORY:latest

      - name: nginx 이미지 빌드 및 푸시
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build --provenance=false -f nginx/Dockerfile.prod -t $REGISTRY/$ECR_NGINX_REPOSITORY:$IMAGE_TAG ./nginx
          docker tag $REGISTRY/$ECR_NGINX_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_NGINX_REPOSITORY:latest
          docker push $REGISTRY/$ECR_NGINX_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_NGINX_REPOSITORY:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: app 태스크 정의 렌더링 (ES_HOST_IP 주입)
        id: render-app
        run: |
          ES_HOST_IP=$(aws ssm get-parameter \
            --name /mople/ES_HOST_IP \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)
          jq --arg ip "$ES_HOST_IP" \
            '.containerDefinitions[0].extraHosts[0].ipAddress = $ip' \
            ${{ env.APP_TASK_DEF_FILE }} > rendered-task-def-app.json
          echo "rendered_file=rendered-task-def-app.json" >> "$GITHUB_OUTPUT"

      - name: app 태스크 정의 등록
        id: register-app
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-app.outputs.rendered_file }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: nginx 태스크 정의 등록
        id: register-nginx
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ env.NGINX_TASK_DEF_FILE }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: app 서비스 업데이트
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.APP_SERVICE }} \
            --task-definition ${{ steps.register-app.outputs.task_def_arn }} \
            --force-new-deployment

      - name: nginx 서비스 업데이트
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.NGINX_SERVICE }} \
            --task-definition ${{ steps.register-nginx.outputs.task_def_arn }} \
            --force-new-deployment

      - name: app 배포 안정화 대기
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.APP_SERVICE }}

      - name: nginx 배포 안정화 대기
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.NGINX_SERVICE }}
