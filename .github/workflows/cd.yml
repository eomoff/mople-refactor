name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI PipeLine"]  # 작성한 ci 이름을 대상으로
    types: [completed]          # 해당 ci가 끝날때 실행해라
    branches: [ "main" ]        # main 브랜치에서 돈 CI만 대상으로함

# push 해서 배포가 도는 중에 또 push가 들어와서 동시에 실행되는 일이 없게끔
# concurrency: 배포가 동시에 실행되지 않도록 설정
# group: 이 이름이 같은 배포끼리는 동시에 실행되지 않고 하나씩 실행됨
# cancel-in-progress:
#   true  - 먼저 돌던 배포를 멈추고 새로 들어온 배포 시작
#   false - 먼저 돌던 배포를 끝까지 돌리고 새로 들어온 배포 시작
concurrency:
  group: mople-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /opt/mople

    steps:
      - name: 배포할 커밋으로 이동
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          git checkout --detach "$SHA"

      - name: app 이미지 빌드 및 컨테이너 교체
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300

      - name: 이전 이미지 정리
        run: docker image prune -f
